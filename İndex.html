
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belinay ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game, #ending {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.content {
    padding: 20px;
    width: 100%;
    max-width: 600px;
}

h1 {
    color: #ffb4d0;
    font-size: 35px;
    margin-bottom: 25px;
}

#question {
    font-size: 21px;
    margin-bottom: 45px;
}

.hearts {
    display: flex;
    justify-content: center;
    gap: 25px;
}

.heart {
    font-size: 55px;
    background: none;
    border: none;
    cursor: pointer;
    transition: transform .2s;
}

.heart:hover {
    transform: scale(1.15);
}

#result {
    margin-top: 35px;
    font-size: 22px;
    min-height: 35px;
}

#progress {
    margin-top: 20px;
    color: #aaa;
    font-size: 14px;
}

#game {
    transition: opacity 1.5s;
}

#ending {
    display: none;
    background: black;
    position: fixed;
    inset: 0;
    overflow: hidden;
}

#fireworks {
    position: absolute;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
}

.message {
    position: relative;
    z-index: 2;
    opacity: 0;
    transition: opacity 2s;
    padding: 20px;
}

.message h1 {
    font-size: 48px;
    color: #ffb6d2;
}

.message p {
    font-size: 19px;
    line-height: 2;
    color: white;
}

.small-note {
    position: absolute;
    bottom: 25px;
    width: 100%;
    color: #888;
    font-size: 12px;
}

.hidden {
    display: none !important;
}

@media(max-width: 500px) {
    .heart {
        font-size: 45px;
    }

    .hearts {
        gap: 15px;
    }

    .message h1 {
        font-size: 38px;
    }

    .message p {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div id="game">
    <div class="content">

        <h1>Selam Belinay ♡</h1>

        <p id="question">
            İlk soruya hazır mısın?
        </p>

        <div class="hearts">

            <button class="heart"
                onclick="choose('yellow')">💛</button>

            <button class="heart"
                onclick="choose('red')">❤️</button>

            <button class="heart"
                onclick="choose('pink')">💗</button>

        </div>

        <div id="result"></div>

        <div id="progress">0 / 3</div>

    </div>
</div>

<div id="ending">

    <canvas id="fireworks"></canvas>

    <div class="message" id="message">

        <h1>İyi ki varsın Belinay! ♡</h1>

        <p>
            Sana küçük bir sürpriz hazırlamak istedim.<br>
            Umarım hoşuna gitmiştir.<br><br>

            Hayatındaki güzel anların hiç bitmemesi<br>
            ve yüzünün hep gülmesi dileğiyle.<br><br>

            Sen gerçekten özelsin. ❤️
        </p>

        <div class="small-note">
            Doğum günün kutlu olsun Belinay ♡
        </div>

    </div>

</div>

<script>

let correct = 0;

const questions = [
    {
        text: "Gökyüzünün en güzel rengi hangisi? Sarı kalbe tıkla!",
        answer: "yellow"
    },
    {
        text: "Aşkın ve sevginin rengi hangisi? Kırmızı kalbe tıkla!",
        answer: "red"
    },
    {
        text: "Tatlı ve romantik olan renk hangisi? Pembe kalbe tıkla!",
        answer: "pink"
    }
];

function updateQuestion() {
    document.getElementById("question").innerText =
        questions[correct].text;
}

updateQuestion();

function choose(color) {

    const result = document.getElementById("result");

    if (color === questions[correct].answer) {

        correct++;

        result.innerText = "Doğru! ♥";
        result.style.color = "#9dffad";

        document.getElementById("progress").innerText =
            correct + " / 3";

        if (correct === 3) {

            result.innerText = "Tebrikler!";

            setTimeout(startEnding, 900);

        } else {

            setTimeout(() => {
                result.innerText = "";
                updateQuestion();
            }, 800);

        }

    } else {

        result.innerText = "😠 Yanlış seçtin!";
        result.style.color = "#ff7777";

        setTimeout(() => {
            result.innerText = "";
        }, 1200);

    }

}

function startEnding() {

    const game = document.getElementById("game");
    const ending = document.getElementById("ending");

    game.style.opacity = "0";

    setTimeout(() => {

        game.style.display = "none";
        ending.style.display = "flex";

        // Biraz tamamen siyah ekran
        setTimeout(() => {

            startFireworks();

            setTimeout(() => {
                document.getElementById("message").style.opacity = "1";
            }, 1800);

        }, 1800);

    }, 1600);

}


// PIXEL HAVAİ FİŞEKLER

function startFireworks() {

    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    const colors = [
        "#ff4d88",
        "#ffe066",
        "#8be9fd",
        "#bd93f9",
        "#ffffff"
    ];

    function createFirework() {

        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height * 0.65;

        const color = colors[
            Math.floor(Math.random() * colors.length)
        ];

        for (let i = 0; i < 35; i++) {

            const angle = Math.PI * 2 * i / 35;
            const speed = 1 + Math.random() * 3;

            particles.push({
                x: x,
                y: y,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                life: 65,
                color: color
            });

        }
    }

    function animate() {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach((p, index) => {

            p.x += p.dx;
            p.y += p.dy;

            p.dy += 0.025;
            p.life--;

            ctx.fillStyle = p.color;

            ctx.fillRect(
                Math.round(p.x),
                Math.round(p.y),
                5,
                5
            );

            if (p.life <= 0) {
                particles.splice(index, 1);
            }

        });

        requestAnimationFrame(animate);
    }

    animate();

    createFirework();

    setInterval(createFirework, 850);

}

</script>

</body>
</html>
